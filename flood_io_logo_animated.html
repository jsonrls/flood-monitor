<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flood.io — Animated Logo</title>
<style>
  :root {
    --navy: #0E3550;
    --cream: #F7F5EF;
    --water-top: #1E9DB8;
    --water-bottom: #0C5C86;
    --crest: #8FE9F2;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .badge-wrap {
    width: 240px;
    height: 240px;
    opacity: 0;
    transform: scale(0.9);
    animation: badgeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  @keyframes badgeIn {
    to { opacity: 1; transform: scale(1); }
  }

  svg { display: block; width: 100%; height: 100%; }

  /* radar pulse rings */
  .ring-pulse {
    transform-box: fill-box;
    transform-origin: center;
    fill: none;
    stroke: var(--cream);
    stroke-width: 10;
    opacity: 0;
    animation: pulse 2.6s ease-out infinite;
  }
  .ring-pulse.r1 { animation-delay: 0s; }
  .ring-pulse.r2 { animation-delay: 0.65s; }
  .ring-pulse.r3 { animation-delay: 1.3s; }
  .ring-pulse.r4 { animation-delay: 1.95s; }

  @keyframes pulse {
    0%   { opacity: 0.55; transform: scale(0.5); }
    70%  { opacity: 0; }
    100% { opacity: 0; transform: scale(1.25); }
  }

  .ring-static { fill: none; stroke: var(--cream); stroke-width: 14; opacity: 0.9; }

  /* rising water mask group */
  .water-rise {
    animation: riseIn 1.1s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes riseIn {
    from { transform: translateY(260px); }
    to   { transform: translateY(0); }
  }

  .wave-scroll {
    animation: scrollWave 3.2s linear infinite;
  }
  @keyframes scrollWave {
    from { transform: translateX(0); }
    to   { transform: translateX(-1024px); }
  }
</style>
</head>

          <stop offset="100%" stop-color="var(--water-bottom)"/>

          <circle cx="512" cy="512" r="180"/>
          <circle cx="512" cy="512" r="90"/>
